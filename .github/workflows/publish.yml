name: Publish site

# Runs whenever anything is committed to main (for example a new scores/Score_Card.xlsx
# uploaded through the GitHub website), and can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # with a live Google Sheet set, refresh the published data and offline copy every 30 minutes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the live Google Sheet, if one is set
        run: |
          ID=$(python -c "import json;print(json.load(open('data/config.json')).get('sheet_id',''))")
          if [ -n "$ID" ]; then
            mkdir -p scores
            if curl -fsSL -o /tmp/live.xlsx "https://docs.google.com/spreadsheets/d/$ID/export?format=xlsx"; then
              mv /tmp/live.xlsx scores/Score_Card.xlsx && echo "Using the live Google Sheet"
            else
              echo "Could not download the Google Sheet; using the uploaded Excel"
            fi
          fi

      - name: Convert scorecard to site data
        run: |
          pip install --quiet openpyxl
          if [ -f scores/Score_Card.xlsx ]; then
            python scripts/update_scores.py scores/Score_Card.xlsx data
          else
            echo "No scores/Score_Card.xlsx found; publishing the data already in the repo."
          fi

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html cheer.html game.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll
          python scripts/build_offline.py _site/tt-offline.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
